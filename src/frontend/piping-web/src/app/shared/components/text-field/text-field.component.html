<label>
  <span>
    {{ label() }}
    @if (required()) {
      <span class="required" aria-hidden="true">*</span>
    }
  </span>
  <input
    type="text"
    [required]="required()"
    [attr.maxlength]="maxLength()"
    [placeholder]="placeholder()"
    [value]="value()"
    [disabled]="disabled()"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  />
</label>
